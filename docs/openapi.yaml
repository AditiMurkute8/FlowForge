openapi: 3.0.3
info:
  title: FlowForge REST API
  description: Canonical OpenAPI specification for FlowForge Single-Node Core Engine.
  version: 0.1.0-SNAPSHOT
servers:
  - url: http://localhost:8080
    description: Local development backend

paths:
  # =========================================================================
  # AUTHENTICATION
  # =========================================================================
  /api/v1/auth/register:
    post:
      summary: Register a new user
      operationId: registerUser
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created and authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/auth/login:
    post:
      summary: Authenticate user credentials
      operationId: loginUser
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successfully authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/me:
    get:
      summary: Get current authenticated user profile
      operationId: getCurrentUser
      tags: [Authentication]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Authenticated user details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # =========================================================================
  # PROJECTS
  # =========================================================================
  /api/v1/projects:
    post:
      summary: Create a new project
      operationId: createProject
      tags: [Projects]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      summary: List user projects with pagination
      operationId: listProjects
      tags: [Projects]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
      responses:
        '200':
          description: Paginated project list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageProjectResponse'

  /api/v1/projects/{projectId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get project by ID
      operationId: getProjectById
      tags: [Projects]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Project details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update project name and description
      operationId: updateProject
      tags: [Projects]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: Project updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete project
      operationId: deleteProject
      tags: [Projects]
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Project deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/projects/slug/{slug}:
    get:
      summary: Get project by slug
      operationId: getProjectBySlug
      tags: [Projects]
      security:
        - BearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Project details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  # =========================================================================
  # PROJECT MEMBERSHIP & RBAC
  # =========================================================================
  /api/v1/projects/{projectId}/members:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: List project members
      operationId: listProjectMembers
      tags: [Project Members]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of members with roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectMemberResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Add or update project member role
      operationId: addProjectMember
      tags: [Project Members]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddProjectMemberRequest'
      responses:
        '200':
          description: Membership updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMemberResponse'
        '201':
          description: Membership created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMemberResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/projects/{projectId}/members/{userId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      summary: Remove member from project
      operationId: removeProjectMember
      tags: [Project Members]
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Member removed
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # =========================================================================
  # WORKFLOWS
  # =========================================================================
  /api/v1/projects/{projectId}/workflows:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Create workflow definition in project
      operationId: createWorkflow
      tags: [Workflows]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkflowRequest'
      responses:
        '201':
          description: Workflow created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      summary: List workflows in project
      operationId: listWorkflowsByProject
      tags: [Workflows]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
      responses:
        '200':
          description: Paginated workflows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageWorkflowResponse'

  /api/v1/workflows/{workflowId}:
    parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get workflow by ID
      operationId: getWorkflowById
      tags: [Workflows]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Workflow details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update workflow name and description
      operationId: updateWorkflow
      tags: [Workflows]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkflowRequest'
      responses:
        '200':
          description: Workflow updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete workflow
      operationId: deleteWorkflow
      tags: [Workflows]
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Workflow deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/projects/{projectId}/workflows/slug/{workflowSlug}:
    get:
      summary: Get workflow by project ID and workflow slug
      operationId: getWorkflowByProjectAndSlug
      tags: [Workflows]
      security:
        - BearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: workflowSlug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Workflow details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  # =========================================================================
  # WORKFLOW VERSIONS
  # =========================================================================
  /api/v1/workflows/{workflowId}/versions:
    parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Create immutable workflow version snapshot
      operationId: createWorkflowVersion
      tags: [Workflow Versions]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkflowVersionRequest'
      responses:
        '201':
          description: Version snapshot persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowVersionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      summary: List version summaries for workflow
      operationId: listWorkflowVersions
      tags: [Workflow Versions]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
      responses:
        '200':
          description: Paginated version summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageWorkflowVersionSummaryResponse'

  /api/v1/workflows/{workflowId}/versions/latest:
    parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get latest version snapshot with full graph payload
      operationId: getLatestWorkflowVersion
      tags: [Workflow Versions]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Latest version snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowVersionResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/workflows/{workflowId}/versions/{versionNumber}:
    parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: versionNumber
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Get specific version snapshot by version number
      operationId: getWorkflowVersionByNumber
      tags: [Workflow Versions]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Version snapshot details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowVersionResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  # =========================================================================
  # DAG VALIDATION & TRANSIENT EXECUTION
  # =========================================================================
  /api/v1/dag/validate:
    post:
      summary: Validate DAG topology without persistence
      operationId: validateDag
      tags: [DAG Engine]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateDagRequest'
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateDagResponse'

  /api/v1/workflows/execute:
    post:
      summary: Execute transient in-memory simulation run
      operationId: executeTransientWorkflow
      tags: [Workflow Execution]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteWorkflowRequest'
      responses:
        '200':
          description: Execution result with telemetry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecuteWorkflowResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  # =========================================================================
  # DURABLE WORKFLOW RUNS & TASK RUNS
  # =========================================================================
  /api/v1/workflows/{workflowId}/runs:
    parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Trigger durable workflow run against version snapshot
      operationId: executeWorkflowRun
      tags: [Workflow Runs]
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteRunRequest'
      responses:
        '200':
          description: Workflow run completed/terminal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRunResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    get:
      summary: List historical durable runs for workflow
      operationId: listWorkflowRuns
      tags: [Workflow Runs]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
      responses:
        '200':
          description: Paginated run summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageWorkflowRunSummaryResponse'

  /api/v1/runs/{runId}:
    parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get durable run details and task runs
      operationId: getWorkflowRunById
      tags: [Workflow Runs]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Workflow run details with tasks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRunResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/runs/{runId}/tasks:
    parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get individual task runs for a workflow run
      operationId: listTaskRuns
      tags: [Workflow Runs]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Task run executions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskRunResponse'
        '404':
          $ref: '#/components/responses/NotFound'

# =========================================================================
# COMPONENTS & SCHEMAS
# =========================================================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PageQuery:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 0
    SizeQuery:
      name: size
      in: query
      required: false
      schema:
        type: integer
        default: 20

  responses:
    BadRequest:
      description: Invalid request parameters or body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Unauthorized:
      description: Authentication credentials missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Forbidden:
      description: Insufficient RBAC role privileges
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Conflict:
      description: Resource uniqueness conflict or foreign key constraint violation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    TooManyRequests:
      description: Server workflow execution capacity exhausted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'

  schemas:
    RegisterRequest:
      type: object
      required: [email, password, fullName]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        fullName:
          type: string
          minLength: 1

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    UserResponse:
      type: object
      required: [id, email, fullName, active, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        fullName:
          type: string
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/UserResponse'

    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        slug:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 500

    UpdateProjectRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500

    ProjectResponse:
      type: object
      required: [id, name, slug, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProjectMemberResponse:
      type: object
      required: [id, projectId, userId, email, fullName, role, createdAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        email:
          type: string
        fullName:
          type: string
        role:
          type: string
          enum: [ADMIN, DEVELOPER, VIEWER]
        createdAt:
          type: string
          format: date-time

    AddProjectMemberRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum: [ADMIN, DEVELOPER, VIEWER]

    CreateWorkflowRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        slug:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 500

    UpdateWorkflowRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500

    WorkflowResponse:
      type: object
      required: [id, projectId, name, slug, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateWorkflowVersionRequest:
      type: object
      required: [graphPayload]
      properties:
        versionTag:
          type: string
        description:
          type: string
        graphPayload:
          type: object

    WorkflowVersionResponse:
      type: object
      required: [id, workflowId, versionNumber, graphPayload, taskCount, edgeCount, isValidDag, createdAt]
      properties:
        id:
          type: string
          format: uuid
        workflowId:
          type: string
          format: uuid
        versionNumber:
          type: integer
        versionTag:
          type: string
        description:
          type: string
        graphPayload:
          type: object
        taskCount:
          type: integer
        edgeCount:
          type: integer
        isValidDag:
          type: boolean
        createdAt:
          type: string
          format: date-time

    WorkflowVersionSummaryResponse:
      type: object
      required: [id, workflowId, versionNumber, taskCount, edgeCount, isValidDag, createdAt]
      properties:
        id:
          type: string
          format: uuid
        workflowId:
          type: string
          format: uuid
        versionNumber:
          type: integer
        versionTag:
          type: string
        description:
          type: string
        taskCount:
          type: integer
        edgeCount:
          type: integer
        isValidDag:
          type: boolean
        createdAt:
          type: string
          format: date-time

    ValidateDagRequest:
      type: object
      required: [tasks, edges]
      properties:
        tasks:
          type: array
          items:
            type: string
        edges:
          type: array
          items:
            $ref: '#/components/schemas/EdgeDto'

    ValidateDagResponse:
      type: object
      required: [valid, hasCycle, errors, warnings, cycleNodes, disconnectedNodes, topologicalOrder]
      properties:
        valid:
          type: boolean
        hasCycle:
          type: boolean
        errors:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
        cycleNodes:
          type: array
          items:
            type: string
        disconnectedNodes:
          type: array
          items:
            type: string
        topologicalOrder:
          type: array
          items:
            type: string

    EdgeDto:
      type: object
      required: [source, target]
      properties:
        source:
          type: string
        target:
          type: string

    ExecuteWorkflowRequest:
      type: object
      required: [tasks, edges]
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/TaskDefinitionDto'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/EdgeDto'
        requestedConcurrency:
          type: integer

    TaskDefinitionDto:
      type: object
      required: [id]
      properties:
        id:
          type: string
        action:
          type: object
        retryPolicy:
          type: object

    ExecuteWorkflowResponse:
      type: object
